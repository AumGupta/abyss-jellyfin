name: build-linux-mac-installer

on:
  push:
    paths:
      - 'setup.sh'
      - 'scripts/docker/abyss-spotlight.sh'
      - 'scripts/spotlight/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-linux-mac-installer.yml'
  pull_request:
    paths:
      - 'setup.sh'
      - 'scripts/docker/abyss-spotlight.sh'
      - 'scripts/spotlight/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-linux-mac-installer.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate sources
        run: npm run check

  build:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Get version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          SHORT_VERSION=$(echo "${TAG#v}" | awk -F. '{printf "%s.%s.%s", $1, ($2==""?"0":$2), ($3==""?"0":$3)}')
          FILE_NAME="abyss-setup-v${SHORT_VERSION}.sh"
          echo "SHORT_VERSION=${SHORT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "FILE_NAME=${FILE_NAME}"         >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        run: |
          sed 's/^BRANCH="main"$/BRANCH="${{ github.ref_name }}"/' setup.sh > "${{ steps.version.outputs.FILE_NAME }}"
          chmod +x    "${{ steps.version.outputs.FILE_NAME }}"

      - name: Upload to new release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.FILE_NAME }}
          fail_on_unmatched_files: true
