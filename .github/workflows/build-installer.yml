name: build-installer

on:
  push:
    paths:
      - 'setup.ps1'
      - 'scripts/setup/**'
      - 'scripts/spotlight/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-installer.yml'
  pull_request:
    paths:
      - 'setup.ps1'
      - 'scripts/setup/**'
      - 'scripts/spotlight/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-installer.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate sources
        run: |
          npm test
          node --check docs/script.js
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
        shell: pwsh

  build:
    if: github.event_name == 'release'
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Cache PS2EXE
        id: cache-ps2exe
        uses: actions/cache@v4.2.2
        with:
          path: C:\Users\runneradmin\Documents\PowerShell\Modules\ps2exe
          key: ps2exe-module-${{ runner.os }}

      - name: Install PS2EXE
        if: steps.cache-ps2exe.outputs.cache-hit != 'true'
        run: Install-Module ps2exe -Force -Scope CurrentUser
        shell: pwsh

      - name: Get version
        id: version
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $version = $parts[0..3] -join '.'
          $shortVersion = $parts[0..2] -join '.'
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "SHORT_VERSION=$shortVersion" >> $env:GITHUB_OUTPUT
          echo "FILE_NAME=abyss-setup-v$shortVersion.exe" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Pin installer sources
        run: |
          $source = [IO.File]::ReadAllText("$PWD/setup.ps1")
          $source = $source -replace '(?m)^\$BRANCH\s*=\s*"main"', '$BRANCH = "${{ github.ref_name }}"'
          [IO.File]::WriteAllText("$PWD/setup-release.ps1", $source, (New-Object Text.UTF8Encoding($false)))
        shell: pwsh

      - name: Build abyss-setup.exe
        run: |
          Invoke-PS2EXE `
            -InputFile .\setup-release.ps1 `
            -OutputFile .\${{ steps.version.outputs.FILE_NAME }} `
            -Title "Abyss Theme Setup" `
            -Description "Installer for Abyss - a clean minimal Jellyfin theme" `
            -Company "AumGupta" `
            -Product "Abyss" `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -IconFile ".\docs\assets\favicon\favicon.ico" `
            -NoConsole:$false
        shell: pwsh

      - name: Upload to new release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.FILE_NAME }}
          fail_on_unmatched_files: true
