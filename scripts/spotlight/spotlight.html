<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Abyss Spotlight</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link
		href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,300..700;1,17..18,300..700&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="spotlight.css" />
</head>

<body>

	<div id="backdrop"><img id="backdrop-img" alt="" /></div>
	<div id="content">
		<img id="logo" alt="" />
		<div id="title"></div>
		<div id="episode-label"></div>
		<div id="meta"></div>
		<div id="progress-wrap" style="display:none">
			<div id="progress-bar"></div>
		</div>
		<div id="plot"></div>
		<div id="buttons"></div>
	</div>
	<div id="carousel-dots"></div>
	<button id="clickzone" type="button" aria-label="View item details"></button>
	<div id="empty" style="display:none">Nothing to show</div>

	<!-- Update notification -->
	<div id="update-toast" style="display:none" role="status" aria-live="polite">
		<div id="update-toast-inner">
			<div id="update-toast-top">
				<svg id="update-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
					fill="currentColor">
					<path
						d="M480-323.39 314.31-489.08l32.61-32.23 110.39 110V-780h45.38v368.69l110.39-110 32.61 32.23L480-323.39ZM237.69-180q-23.53 0-40.61-17.08T180-237.69V-363h45.39v125.31q0 4.61 3.84 8.46 3.85 3.84 8.46 3.84h484.62q4.61 0 8.46-3.84 3.84-3.85 3.84-8.46V-363H780v125.31q0 23.53-17.08 40.61T722.31-180H237.69Z" />
				</svg>
				<span id="update-text"></span>
				<button id="update-dismiss" aria-label="Dismiss notification">
					<svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px"
						fill="currentColor">
						<path
							d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
					</svg>
				</button>
			</div>
			<div id="update-toast-actions">
				<a id="update-link" href="#" target="_blank" rel="noopener noreferrer">View release</a>
				<button id="update-mute" type="button">Don't show again</button>
			</div>
		</div>
	</div>

	<script>
		// Updated automatically by the installer on each install/update.
		const ABYSS_SPOTLIGHT_VERSION = '1.2.2';

		(() => {
			const $ = id => document.getElementById(id);
			const AUTO_INTERVAL = 5000;
			const REFRESH_INTERVAL = 60000;
			const FIELDS = 'Overview,RunTimeTicks,UserData,OfficialRating,CommunityRating,SeriesName,SeriesId,ParentIndexNumber,IndexNumber,PlaybackPositionTicks';
			const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
			const imageCache = new Map();
			let items = [];
			let currentIndex = 0;
			let autoTimer = null;
			let preloadTimer = null;
			let renderController = null;
			let preloadController = null;
			let refreshController = null;
			let refreshPromise = null;
			let zoomAnimation = null;
			let renderSequence = 0;
			let lastRefresh = 0;
			let paused = true;
			let disposed = false;

			const SVG_PLAY = `<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M320-273v-414q0-17 12-28.5t28-11.5q5 0 10.5 1.5T381-721l326 207q9 6 13.5 15t4.5 19q0 10-4.5 19T707-446L381-239q-5 3-10.5 4.5T360-233q-16 0-28-11.5T320-273Z"/></svg>`;
			const SVG_INFO = `<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M423.5-703.5Q400-727 400-760t23.5-56.5Q447-840 480-840t56.5 23.5Q560-793 560-760t-23.5 56.5Q513-680 480-680t-56.5-23.5Zm14 566Q420-155 420-180v-360q0-25 17.5-42.5T480-600q25 0 42.5 17.5T540-540v360q0 25-17.5 42.5T480-120q-25 0-42.5-17.5Z"/></svg>`;
			const SVG_RATING = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="M168-144q-29 0-50.5-21.5T96-216v-528q0-29.7 21.5-50.85Q139-816 168-816h624q29 0 50.5 21.15T864-744v528q0 29-21.5 50.5T792-144H168Zm337.5-154.35Q516-308.7 516-324v-168q0-15.3-10.29-25.65Q495.42-528 480.21-528t-25.71 10.35Q444-507.3 444-492v168q0 15.3 10.29 25.65Q464.58-288 479.79-288t25.71-10.35ZM480-600q14 0 25-11t11-25.5q0-14.5-11-25T479.5-672q-14.5 0-25 10.35T444-636q0 14 10.35 25T480-600ZM168-228h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-372h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-516h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-660h72v-72h-72v72Zm552 0h72v-72h-72v72Z"/></svg>`;
			const SVG_CLOCK = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="M516-510v-174q0-15.3-10.29-25.65Q495.42-720 480.21-720t-25.71 10.35Q444-699.3 444-684v189q0 8 3 14.5t8 11.5l133.85 133.85Q600-324 614.5-324.5 629-325 640-336t11-25.5q0-14.5-11.34-25.75L516-510ZM480-96q-79.38 0-149.19-30T208.5-208.5Q156-261 126-330.96t-30-149.5Q96-560 126-630q30-70 82.5-122t122.46-82q69.96-30 149.5-30t149.55 30.24q70 30.24 121.79 82.08 51.78 51.84 81.99 121.92Q864-559.68 864-480q0 79.38-30 149.19T752-208.5Q700-156 629.87-126T480-96Z"/></svg>`;
			const SVG_STAR = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="m480-285-164 98q-11 6-21.5 5t-18.5-7q-8-6-12-16.5t-1-21.5l43-183-145-123q-9-8-11-18.5t1-20.5q3-10 11-16.5t20-7.5l190-17 75-174q5-11 14-16.5t19-5.5q10 0 19 5.5t14 16.5l75 175 190 16q12 1 20 8t11 17q3 10 .5 20T798-533L654-410l43 183q3 11-1 21.5T684-189q-8 6-18.5 7t-21.5-5l-164-98Z"/></svg>`;

			function normalizeAddress(value) {
				if (!value) return '';
				try {
					const url = new URL(value, window.location.origin);
					return `${url.origin}${url.pathname.replace(/\/+$/, '')}`;
				} catch { return ''; }
			}

			function getBaseUrl() {
				try {
					const loc = window.top.location;
					const match = loc.pathname.match(/^(.*?)\/web\b/);
					return normalizeAddress(`${loc.protocol}//${loc.host}${match ? match[1] : ''}`);
				} catch {
					try {
						const credentials = JSON.parse(localStorage.getItem('jellyfin_credentials'));
						const server = credentials?.Servers?.find(entry => entry.AccessToken && entry.UserId);
						return normalizeAddress(server?.ManualAddress || server?.LocalAddress || server?.RemoteAddress);
					} catch { return ''; }
				}
			}

			function getAuth(baseUrl) {
				try {
					const credentials = JSON.parse(localStorage.getItem('jellyfin_credentials'));
					const servers = credentials?.Servers || [];
					const matchesBase = server => [server.ManualAddress, server.LocalAddress, server.RemoteAddress]
						.some(address => normalizeAddress(address) === baseUrl);
					const server = servers.find(entry => entry.AccessToken && entry.UserId && matchesBase(entry))
						|| servers.find(entry => entry.AccessToken && entry.UserId);
					return { token: server?.AccessToken, userId: server?.UserId };
				} catch { return {}; }
			}

			function authHeaders(token) {
				return { 'Authorization': `MediaBrowser Client="Jellyfin Web", Device="Abyss Spotlight", DeviceId="abyss-spotlight", Version="1.0", Token="${token}"` };
			}

			function formatRuntime(ticks) {
				if (!ticks) return null;
				const mins = Math.floor(ticks / 600000000);
				if (mins < 60) return `${mins}m`;
				const hours = Math.floor(mins / 60);
				const remainder = mins % 60;
				return remainder > 0 ? `${hours}h ${remainder}m` : `${hours}h`;
			}

			function metaPillWithIcon(iconSvg, text) {
				const pill = document.createElement('span');
				const label = document.createElement('span');
				pill.className = 'meta-pill';
				pill.innerHTML = iconSvg;
				label.textContent = String(text);
				pill.appendChild(label);
				return pill;
			}

			function navigateTo(route) {
				try { window.top.location.hash = route; }
				catch { window.location.hash = route; }
			}

			function imageDimensions(type) {
				const dpr = Math.min(window.devicePixelRatio || 1, 2);
				if (type === 'Logo') {
					return { width: Math.min(960, Math.ceil(window.innerWidth * 0.55 * dpr)), height: Math.min(360, Math.ceil(120 * dpr)) };
				}
				return { width: Math.min(2560, Math.ceil(window.innerWidth * dpr)), height: Math.min(1440, Math.ceil(window.innerHeight * dpr)) };
			}

			function imageUrl(itemId, type, index = null) {
				const { width, height } = imageDimensions(type);
				const suffix = index == null ? '' : `/${index}`;
				return `${base}/Items/${itemId}/Images/${type}${suffix}?quality=88&maxWidth=${width}&maxHeight=${height}`;
			}

			async function fetchImage(url, signal) {
				if (imageCache.has(url)) return imageCache.get(url);
				try {
					const response = await fetch(url, { headers, signal });
					if (!response.ok) return null;
					const objectUrl = URL.createObjectURL(await response.blob());
					imageCache.set(url, objectUrl);
					return objectUrl;
				} catch (error) {
					if (error.name === 'AbortError') throw error;
					return null;
				}
			}

			function clearImageCache() {
				for (const objectUrl of imageCache.values()) URL.revokeObjectURL(objectUrl);
				imageCache.clear();
			}

			function wait(ms, signal) {
				if (ms === 0) return Promise.resolve();
				return new Promise((resolve, reject) => {
					const timer = setTimeout(resolve, ms);
					signal.addEventListener('abort', () => {
						clearTimeout(timer);
						reject(new DOMException('Aborted', 'AbortError'));
					}, { once: true });
				});
			}

			function startZoom(image) {
				zoomAnimation?.cancel();
				zoomAnimation = null;
				image.style.transform = 'scale(1) translate(0, 0)';
				if (paused || reducedMotion.matches) return;
				const angle = Math.random() * Math.PI * 2;
				const panX = Math.cos(angle) * 1.5;
				const panY = Math.sin(angle) * 1.5;
				zoomAnimation = image.animate([
					{ transform: 'scale(1) translate(0, 0)' },
					{ transform: `scale(1.08) translate(${panX}%, ${panY}%)` }
				], { duration: 9000, easing: 'linear', fill: 'forwards' });
			}

			function semverGt(a, b) {
				const current = a.split('.').map(Number);
				const installed = b.split('.').map(Number);
				for (let i = 0; i < 3; i++) {
					if ((current[i] || 0) > (installed[i] || 0)) return true;
					if ((current[i] || 0) < (installed[i] || 0)) return false;
				}
				return false;
			}

			async function isAdminUser(base, token, userId) {
				try {
					const response = await fetch(`${base}/Users/${userId}`, { headers: authHeaders(token) });
					if (!response.ok) return false;
					const data = await response.json();
					return !!data?.Policy?.IsAdministrator;
				} catch {
					// If we can't confirm admin status, err on the side of not nagging non-admins.
					return false;
				}
			}

			async function checkForUpdate(base, token, userId) {
				const sessionDismissKey = 'abyss-update-dismissed';
				const checkKey = 'abyss-update-checked-at';
				if (sessionStorage.getItem(sessionDismissKey)) return;
				if (Date.now() - Number(sessionStorage.getItem(checkKey) || 0) < 21600000) return;
				try {
					if (base && token && userId) {
						const admin = await isAdminUser(base, token, userId);
						if (!admin) return;
					}
					const response = await fetch('https://api.github.com/repos/AumGupta/abyss-jellyfin/releases/latest');
					sessionStorage.setItem(checkKey, String(Date.now()));
					if (!response.ok) return;
					const data = await response.json();
					const latest = (data.tag_name || '').replace(/^v/, '');
					if (!latest || !semverGt(latest, ABYSS_SPOTLIGHT_VERSION)) return;
					const muteKey = `abyss-update-muted-v${latest}`;
					if (localStorage.getItem(muteKey)) return;
					$('update-text').textContent = `Abyss v${latest} available, download and re-run the installer to update.`;
					$('update-link').href = data.html_url || `https://github.com/AumGupta/abyss-jellyfin/releases/tag/v${latest}`;
					$('update-toast').style.display = 'flex';
					requestAnimationFrame(() => $('update-toast').classList.add('visible'));
					const hideToast = () => {
						$('update-toast').classList.remove('visible');
						setTimeout(() => { $('update-toast').style.display = 'none'; }, 400);
					};
					$('update-dismiss').addEventListener('click', () => {
						hideToast();
						sessionStorage.setItem(sessionDismissKey, '1');
					}, { once: true });
					$('update-mute').addEventListener('click', () => {
						hideToast();
						localStorage.setItem(muteKey, '1');
					}, { once: true });
				} catch { /* Updates are optional when GitHub is unavailable. */ }
			}

			const base = getBaseUrl();
			const { token, userId } = getAuth(base);
			if (!base || !token || !userId) { $('empty').style.display = 'flex'; return; }
			const headers = authHeaders(token);

			async function fetchJson(url, signal) {
				const response = await fetch(url, { headers, signal });
				return response.ok ? response.json() : {};
			}

			async function fetchItems(signal) {
				const [resumeResult, nextUpResult] = await Promise.allSettled([
					fetchJson(`${base}/Users/${userId}/Items/Resume?Limit=3&Recursive=true&Fields=${FIELDS}`, signal),
					fetchJson(`${base}/Shows/NextUp?Limit=5&UserId=${userId}&Fields=${FIELDS}`, signal)
				]);
				if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
				const resumeItems = resumeResult.status === 'fulfilled' ? resumeResult.value.Items || [] : [];
				const nextUpItems = nextUpResult.status === 'fulfilled' ? nextUpResult.value.Items || [] : [];
				const combined = [
					...resumeItems.map(item => ({ ...item, _source: 'resume' })),
					...nextUpItems.map(item => ({ ...item, _source: 'nextup' }))
				];
				let result = [...new Map(combined.map(item => [item.Id, item])).values()];
				if (result.length === 0) {
					try {
						const fallback = await fetchJson(`${base}/Users/${userId}/Items?Limit=8&Recursive=true&SortBy=Random&IncludeItemTypes=Movie,Series&Fields=${FIELDS}`, signal);
						result = (fallback.Items || []).map(item => ({ ...item, _source: 'random' }));
					} catch (error) {
						if (error.name === 'AbortError') throw error;
					}
				}
				return result;
			}

			function stopAuto() {
				if (autoTimer) clearTimeout(autoTimer);
				autoTimer = null;
			}

			function startAuto() {
				stopAuto();
				if (paused || disposed || items.length <= 1 || reducedMotion.matches) return;
				autoTimer = setTimeout(async () => {
					currentIndex = (currentIndex + 1) % items.length;
					await renderItem(currentIndex);
					startAuto();
				}, AUTO_INTERVAL);
			}

			function updateDots() {
				const dots = [...$('carousel-dots').querySelectorAll('.dot')];
				dots.forEach((dot, index) => {
					const distance = Math.abs(index - currentIndex);
					dot.className = 'dot ' + (distance === 0 ? 'dot-active' : distance === 1 ? 'dot-near' : distance === 2 ? 'dot-far' : 'dot-hidden');
					dot.setAttribute('aria-current', distance === 0 ? 'true' : 'false');
				});
			}

			async function selectItem(index) {
				if (paused || disposed || items.length < 2) return;
				stopAuto();
				currentIndex = (index + items.length) % items.length;
				await renderItem(currentIndex);
				startAuto();
			}

			function buildDots() {
				try {
					const container = $('carousel-dots');
					while (container.firstChild) container.removeChild(container.firstChild);
					container.style.display = items.length > 1 ? 'flex' : 'none';
					items.forEach((_, index) => {
						const dot = document.createElement('button');
						dot.type = 'button';
						dot.className = 'dot';
						dot.setAttribute('aria-label', `Show item ${index + 1}`);
						dot.addEventListener('click', event => {
							event.stopPropagation();
							selectItem(index);
						});
						container.appendChild(dot);
					});
					updateDots();
				} catch (error) {
					console.error('[Abyss Spotlight] buildDots failed:', error);
				}
			}

			function itemImageUrls(item) {
				const isEpisode = item.Type === 'Episode';
				const artworkId = isEpisode ? item.SeriesId || item.Id : item.Id;
				return {
					primary: isEpisode ? imageUrl(item.Id, 'Primary') : null,
					backdrop: imageUrl(artworkId, 'Backdrop', 0),
					logo: imageUrl(artworkId, 'Logo')
				};
			}

			async function fetchArtwork(item, signal) {
				const urls = itemImageUrls(item);
				const logoPromise = fetchImage(urls.logo, signal);
				let backdrop = urls.primary ? await fetchImage(urls.primary, signal) : null;
				let primaryBackdrop = Boolean(backdrop);
				if (!backdrop) {
					backdrop = await fetchImage(urls.backdrop, signal);
					primaryBackdrop = false;
				}
				return { backdrop, logo: await logoPromise, primaryBackdrop };
			}

			function queuePreload() {
				if (preloadTimer) clearTimeout(preloadTimer);
				preloadController?.abort();
				if (paused || items.length <= 1) return;
				preloadController = new AbortController();
				const next = items[(currentIndex + 1) % items.length];
				preloadTimer = setTimeout(() => {
					fetchArtwork(next, preloadController.signal).catch(() => {});
				}, 250);
			}

			function setButtonContent(button, icon, label = '') {
				button.innerHTML = icon;
				if (label) {
					const text = document.createElement('span');
					text.textContent = label;
					button.appendChild(text);
				}
			}

			function triggerPlayback(item, route) {
				try {
					const parentDoc = window.top.document;
					const actionButton = parentDoc.querySelector(
						`[data-id="${item.Id}"][data-action="resume"],` +
						`[data-id="${item.Id}"] [data-action="resume"],` +
						`[data-id="${item.Id}"][data-action="play"],` +
						`[data-id="${item.Id}"] [data-action="play"]`
					);
					if (actionButton) { actionButton.click(); return; }
					const card = parentDoc.querySelector(`[data-id="${item.Id}"]`);
					if (card) { card.click(); return; }
				} catch (error) {
					console.warn('[Abyss Spotlight] Could not trigger playback:', error);
				}
				navigateTo(route);
			}

			function updateContent(item, artwork) {
				const isEpisode = item.Type === 'Episode';
				const detailId = isEpisode ? item.SeriesId || item.Id : item.Id;
				const detailRoute = `/details?id=${detailId}`;
				const playRoute = `/video?id=${item.Id}`;
				const title = isEpisode ? item.SeriesName || item.Name : item.Name;
				const backdropImage = $('backdrop-img');
				const logo = $('logo');
				const titleElement = $('title');

				if (artwork.backdrop) {
					backdropImage.src = artwork.backdrop;
					backdropImage.style.objectPosition = artwork.primaryBackdrop ? 'center center' : 'center 20%';
					$('backdrop').classList.add('loaded');
					startZoom(backdropImage);
				} else {
					zoomAnimation?.cancel();
					zoomAnimation = null;
					backdropImage.removeAttribute('src');
					backdropImage.style.transform = '';
					$('backdrop').classList.add('loaded');
				}

				let episodePrefix = '';

				try {
					if (artwork.logo) {
						logo.src = artwork.logo;
						logo.style.display = 'block';
						titleElement.style.display = 'none';
					} else {
						logo.removeAttribute('src');
						logo.style.display = 'none';
						titleElement.style.display = 'block';
						titleElement.textContent = title;
					}
				} catch (error) {
					console.error('[Abyss Spotlight] logo/title section failed:', error);
				}

				try {
					if (isEpisode) {
						const parts = [];
						if (item.ParentIndexNumber != null && item.IndexNumber != null) {
							episodePrefix = `S${item.ParentIndexNumber} E${item.IndexNumber}`;
							parts.push(episodePrefix);
						}
						if (item.Name) parts.push(item.Name);
						$('episode-label').textContent = parts.join('  \u2013  ');
						$('episode-label').style.display = 'block';
					} else {
						$('episode-label').textContent = '';
						$('episode-label').style.display = 'none';
					}
				} catch (error) {
					console.error('[Abyss Spotlight] episode label section failed:', error);
				}

				try {
					const isResume = item._source === 'resume';
					const playLabel = isResume ? (isEpisode ? `Continue ${episodePrefix}` : 'Resume') : (isEpisode ? `Play ${episodePrefix}`.trim() : 'Play');
					const playButton = document.createElement('button');
					playButton.type = 'button';
					playButton.className = 'btn btn-play';
					setButtonContent(playButton, SVG_PLAY, playLabel);
					playButton.addEventListener('click', () => triggerPlayback(item, playRoute));

					const infoButton = document.createElement('a');
					infoButton.className = 'btn btn-info';
					infoButton.href = `#${detailRoute}`;
					infoButton.setAttribute('aria-label', `View details for ${title}`);
					setButtonContent(infoButton, SVG_INFO);
					infoButton.addEventListener('click', event => { event.preventDefault(); navigateTo(detailRoute); });
					const buttonsContainer = $('buttons');
					while (buttonsContainer.firstChild) buttonsContainer.removeChild(buttonsContainer.firstChild);
					buttonsContainer.appendChild(playButton);
					buttonsContainer.appendChild(infoButton);
				} catch (error) {
					console.error('[Abyss Spotlight] buttons section failed:', error);
				}

				try {
					const meta = $('meta');
					while (meta.firstChild) meta.removeChild(meta.firstChild);
					if (item.OfficialRating) meta.appendChild(metaPillWithIcon(SVG_RATING, item.OfficialRating));
					const runtime = formatRuntime(item.RunTimeTicks);
					if (runtime) meta.appendChild(metaPillWithIcon(SVG_CLOCK, runtime));
					const rating = Number(item.CommunityRating);
					if (Number.isFinite(rating) && rating > 0) meta.appendChild(metaPillWithIcon(SVG_STAR, rating.toFixed(1)));
				} catch (error) {
					console.error('[Abyss Spotlight] meta pills section failed:', error);
				}

				try {
					const isResume = item._source === 'resume';
					const userData = item.UserData || {};
					const played = Number(userData.PlayedPercentage);
					$('progress-wrap').style.display = played > 0 && isResume ? 'block' : 'none';
					$('progress-bar').style.width = `${Math.min(Math.max(played || 0, 0), 100)}%`;
				} catch (error) {
					console.error('[Abyss Spotlight] progress bar section failed:', error);
				}

				try {
					$('plot').textContent = item.Overview || '';
				} catch (error) {
					console.error('[Abyss Spotlight] plot section failed:', error);
				}

				try {
					$('clickzone').setAttribute('aria-label', `View details for ${title}`);
					$('clickzone').onclick = () => navigateTo(detailRoute);
				} catch (error) {
					console.error('[Abyss Spotlight] clickzone section failed:', error);
				}
			}

			async function renderItem(index) {
				const item = items[index];
				if (!item || paused || disposed) return false;
				renderController?.abort();
				renderController = new AbortController();
				const { signal } = renderController;
				const sequence = ++renderSequence;
				updateDots();
				try {
					const artwork = await fetchArtwork(item, signal);
					if (signal.aborted || sequence !== renderSequence) return false;
					$('content').classList.remove('visible');
					$('backdrop').classList.remove('loaded');
					await wait(reducedMotion.matches ? 0 : 260, signal);
					if (signal.aborted || sequence !== renderSequence) return false;
					try {
						updateContent(item, artwork);
					} catch (error) {
						console.error('[Abyss Spotlight] updateContent error:', error);
					}
					$('content').classList.add('visible');
					queuePreload();
					return true;
				} catch (error) {
					if (error.name !== 'AbortError') console.error('[Abyss Spotlight] render error:', error);
					return false;
				}
			}

			async function refreshItems() {
				if (refreshPromise) return refreshPromise;
				refreshController?.abort();
				refreshController = new AbortController();
				refreshPromise = (async () => {
					const currentId = items[currentIndex]?.Id;
					const nextItems = await fetchItems(refreshController.signal);
					if (paused || disposed) return;
					items = nextItems;
					lastRefresh = Date.now();
					currentIndex = Math.max(0, items.findIndex(item => item.Id === currentId));
					$('empty').style.display = items.length ? 'none' : 'flex';
					buildDots();
					if (items.length) await renderItem(currentIndex);
				})();
				try { await refreshPromise; }
				catch (error) { if (error.name !== 'AbortError') console.error('[Abyss Spotlight] refresh error:', error); }
				finally { refreshPromise = null; }
			}

			function pause() {
				if (paused || disposed) return;
				paused = true;
				stopAuto();
				if (preloadTimer) clearTimeout(preloadTimer);
				preloadTimer = null;
				renderController?.abort();
				preloadController?.abort();
				refreshController?.abort();
				zoomAnimation?.cancel();
				zoomAnimation = null;
			}

			async function resume() {
				if (disposed) return;
				const wasPaused = paused;
				paused = false;
				if (!items.length || Date.now() - lastRefresh > REFRESH_INTERVAL) await refreshItems();
				else if (wasPaused) await renderItem(currentIndex);
				startAuto();
			}

			function dispose() {
				if (disposed) return;
				disposed = true;
				paused = true;
				stopAuto();
				if (preloadTimer) clearTimeout(preloadTimer);
				renderController?.abort();
				preloadController?.abort();
				refreshController?.abort();
				zoomAnimation?.cancel();
				clearImageCache();
			}

			let touchStartX = 0;
			let touchStartY = 0;
			let touchTargetIsInteractive = false;
			document.addEventListener('touchstart', event => {
				const touch = event.changedTouches[0];
				touchStartX = touch.screenX;
				touchStartY = touch.screenY;
				touchTargetIsInteractive = Boolean(event.target.closest('button, a, input, select, textarea'));
			}, { passive: true });
			document.addEventListener('touchend', event => {
				if (touchTargetIsInteractive || paused || items.length < 2) return;
				const touch = event.changedTouches[0];
				const deltaX = touch.screenX - touchStartX;
				const deltaY = touch.screenY - touchStartY;
				if (Math.abs(deltaX) < 50 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
				selectItem(currentIndex + (deltaX < 0 ? 1 : -1));
			}, { passive: true });

			window.addEventListener('message', event => {
				if (event.source !== window.parent || event.origin !== window.location.origin || event.data?.type !== 'abyss-spotlight') return;
				const { action } = event.data;
				if (action === 'pause') pause();
				if (action === 'resume') resume();
			});
			document.addEventListener('visibilitychange', () => { document.hidden ? pause() : resume(); });
			window.addEventListener('pagehide', dispose, { once: true });
			reducedMotion.addEventListener?.('change', () => {
				if (reducedMotion.matches) {
					zoomAnimation?.cancel();
					zoomAnimation = null;
					stopAuto();
				} else if (!paused) {
					startZoom($('backdrop-img'));
					startAuto();
				}
			});

			checkForUpdate(base, token, userId);
			if (!document.hidden) resume();
		})();
	</script>
</body>
